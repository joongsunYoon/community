apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: community
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/joongsunYoon/community.git
    targetRevision: main
    path: .
    helm:
      releaseName: community
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
